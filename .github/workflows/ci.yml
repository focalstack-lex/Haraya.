name: CI

# Every push and pull request runs the same checks done by hand before a release:
# lint, the code map staleness gate, tests, the dependency audit, and a production build.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run map:code:check
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
